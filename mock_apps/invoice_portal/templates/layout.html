<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Invoice Portal{% endblock %}</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --badge-paid-bg: #065f46;
            --badge-paid-text: #34d399;
            --badge-unpaid-bg: #991b1b;
            --badge-unpaid-text: #f87171;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.25rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .input-text {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .input-text:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-paid {
            background-color: var(--badge-paid-bg);
            color: var(--badge-paid-text);
        }

        .status-unpaid {
            background-color: var(--badge-unpaid-bg);
            color: var(--badge-unpaid-text);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }

        th, td {
            text-align: left;
            padding: 0.85rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
        }

        a.link-item {
            color: var(--accent-blue);
            text-decoration: none;
        }

        a.link-item:hover {
            text-decoration: underline;
        }

        .admin-banner {
            background-color: #451a03;
            border: 1px solid #78350f;
            color: #fde68a;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" data-testid="nav-brand">🏢 Vendor Invoice Portal</a>
        <span style="color: var(--text-muted); font-size: 0.9rem;">Port 8001</span>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
